name: Add Anna Huebner exam case once

on:
  push:
    branches:
      - feat/einkommensteuer-klausur-anna-huebner-2026
    paths:
      - ".github/workflows/add-anna-huebner-exam-case-once.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/einkommensteuer-klausur-anna-huebner-2026
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add exam case
        run: python scripts/add-anna-huebner-exam-case.py
      - name: Commit generated case
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(klausurtraining): Einkommensteuerfall Anna Hübner 2026 ergänzen"
          git push origin feat/einkommensteuer-klausur-anna-huebner-2026
