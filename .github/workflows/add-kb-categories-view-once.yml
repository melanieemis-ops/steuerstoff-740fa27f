name: Add KB categories overview once

on:
  push:
    paths:
      - ".github/workflows/add-kb-categories-view-once.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update Wissensdatenbank view
        run: python scripts/add-kb-categories-view.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(wissensdatenbank): add categories overview" || exit 0
          git push origin main
