name: Expand NPO learning questions once

on:
  push:
    paths:
      - ".github/workflows/expand-npo-learning-once.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Expand NPO questions
        run: python scripts/expand-npo-learning-questions.py
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/expand-npo-learning-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(lernen): NPO-Fragen aus Wissensdatenbank erweitern" || exit 0
          git push origin main
