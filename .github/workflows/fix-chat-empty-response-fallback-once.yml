name: Fix chat empty response fallback once

on:
  push:
    paths:
      - ".github/workflows/fix-chat-empty-response-fallback-once.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch chat fallback
        run: python scripts/fix-chat-empty-response-fallback.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(chat): answer empty model responses with local fallback" || exit 0
          git push origin main
