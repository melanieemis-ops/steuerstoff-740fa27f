name: Restore magazine cover 03

on:
  push:
    paths:
      - '.github/workflows/restore-magazine-cover-03.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore valid WebP and beige background
        shell: bash
        run: |
          set -euo pipefail
          git show 9b744d073fb7f5be919df39d2f76bc012ef9e154:public/magazin-cover-ausgabe-03-familienstiftung.webp > public/magazin-cover-ausgabe-03-familienstiftung.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/MagazineFlipbook.tsx')
          s = p.read_text(encoding='utf-8')
          marker = 'id: "03"'
          start = s.index(marker)
          end = s.index('articleIds:', start)
          block = s[start:end]
          block = block.replace('coverBackgroundColor: "#000000"', 'coverBackgroundColor: "#f6f0e7"')
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/magazin-cover-ausgabe-03-familienstiftung.webp src/components/MagazineFlipbook.tsx
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "fix(magazine): restore valid cover for issue 03"
          git push
