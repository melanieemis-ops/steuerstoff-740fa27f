name: Use uploaded magazine cover 03

on:
  push:
    paths:
      - ".github/workflows/use-hd-cover-03.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  switch-cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Point issue 03 to uploaded PNG cover
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/MagazineFlipbook.tsx')
          text = path.read_text(encoding='utf-8')
          old = '/magazin-cover-ausgabe-03-hd.svg'
          new = '/737730FA-7DD4-4988-99E1-AB74F22B6479.png'
          if old not in text and new not in text:
              raise SystemExit('Cover path not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/MagazineFlipbook.tsx
          if git diff --cached --quiet; then
            echo "Already updated"
          else
            git commit -m "fix(magazine): use uploaded cover for issue 03"
            git push
          fi
