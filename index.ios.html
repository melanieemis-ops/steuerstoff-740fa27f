<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>steuerstoff</title>
    <style>
      :root {
        color-scheme: light;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f4ef;
        color: #1a1f2f;
      }

      #root {
        min-height: 100dvh;
      }

      #ios-boot-fallback {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(180deg, #fffdf8 0%, #f6f0e6 100%);
      }

      #ios-boot-fallback[hidden] {
        display: none;
      }

      .ios-boot-card {
        width: min(420px, 100%);
        border-radius: 18px;
        border: 1px solid #d6cfbf;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(31, 41, 55, 0.12);
        padding: 20px;
      }

      .ios-boot-card h1 {
        margin: 0 0 8px;
        font-size: 18px;
        line-height: 1.3;
      }

      .ios-boot-card p {
        margin: 0;
        font-size: 14px;
        line-height: 1.45;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <div id="ios-boot-fallback" role="status" aria-live="polite">
      <div class="ios-boot-card">
        <h1>steuerstoff konnte nicht gestartet werden.</h1>
        <p>
          Wenn diese Meldung dauerhaft sichtbar bleibt, ist JavaScript in der App nicht gestartet.
          Bitte App schließen und erneut öffnen.
        </p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/ios-bootstrap.ts"></script>
  </body>
</html>
